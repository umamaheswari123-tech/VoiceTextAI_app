<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VocalBridge</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
  <h1>🎙️ VocalBridge</h1>
  <p class="subtitle">Speech-to-Text & Text-to-Speech System</p>

  <div class="tabs">
    <button class="tab-btn active" onclick="showTab('tts')">Text to Speech</button>
    <button class="tab-btn" onclick="showTab('stt')">Speech to Text</button>
  </div>

  <div id="tts" class="tab-content active">
    <textarea id="text-input" placeholder="Enter text here..." rows="5"></textarea>
    <select id="lang-select">
      <option value="en">English</option>
      <option value="te">Telugu</option>
      <option value="hi">Hindi</option>
    </select>
    <button onclick="convertToSpeech()">Convert to Speech</button>
    <div id="tts-result"></div>
  </div>

  <div id="stt" class="tab-content">
    <input type="file" id="audio-upload" accept=".wav">
    <button onclick="convertToText()">Transcribe Audio</button>
    <div id="stt-result"></div>
  </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
